
name: Spoiler Alert CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check API loads
        run: python -c "from app import app; print('API loaded successfully')"

      - name: Build Docker image
        run: docker build -t spoiler-alert .
